[package]
name = "tomo-desktop"
version = "0.1.0"
description = "Download manga/manhwa as CBZ for Tachimanga"
authors = ["phancis"]
license = "MIT"
repository = "https://github.com/francisphan/Tomo"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tomo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2"
